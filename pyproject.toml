[project]
name = "sales_lakehouse_pipeline"
version = "0.1.0"
description = "Incremental Bronze/Silver/Gold sales pipeline on Databricks with data-quality gates and CI/CD."
authors = [{ name = "Dhanush" }]
requires-python = ">=3.10,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "pyspark==3.5.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_lakehouse_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Databricks notebooks use spark/dbutils/%sql magics that plain linting cannot resolve.
extend-exclude = ["*.ipynb"]
